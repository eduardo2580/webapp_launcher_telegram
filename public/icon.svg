<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2AABEE" />
      <stop offset="100%" stop-color="#229ED9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#grad)" />
  
  <!-- Outer subtle ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="10" />

  <!-- App Grid Launcher Icon in Center -->
  <g filter="url(#shadow)">
    <!-- 4 App icons forming a launcher matrix -->
    <rect x="148" y="148" width="80" height="80" rx="20" fill="#ffffff" fill-opacity="0.95" />
    <rect x="284" y="148" width="80" height="80" rx="20" fill="#ffffff" fill-opacity="0.95" />
    <rect x="148" y="284" width="80" height="80" rx="20" fill="#ffffff" fill-opacity="0.95" />
    
    <!-- Bottom right rocket launcher badge -->
    <rect x="284" y="284" width="80" height="80" rx="20" fill="#ffffff" />
    <path d="M324 298 C338 308, 345 322, 348 338 L340 342 L334 336 L328 342 L320 334 C326 318, 318 306, 324 298 Z" fill="#229ED9" />
  </g>
  
  <!-- Inner Dots -->
  <circle cx="188" cy="188" r="14" fill="#229ED9" />
  <circle cx="324" cy="188" r="14" fill="#229ED9" />
  <circle cx="188" cy="324" r="14" fill="#229ED9" />
</svg>
