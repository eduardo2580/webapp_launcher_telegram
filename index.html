<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Inicializador de aplicativos web para Telegram</title>
    <meta name="description" content="Inicializador leve de Mini Apps do Telegram e aplicativos web, com sincronização pelo Telegram Cloud." />
    <meta property="og:title" content="Inicializador de aplicativos web para Telegram" />
    <meta property="og:description" content="Inicializador leve de Mini Apps do Telegram e aplicativos web, com sincronização pelo Telegram Cloud." />
    <meta property="og:type" content="website" />
    
    <!-- PWA & Mobile Web Meta -->
    <meta name="theme-color" content="#2481cc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Inicializador Web" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Telegram WebApp Native SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        const hadController = Boolean(navigator.serviceWorker.controller);
        let reloadedForUpdate = false;

        if (hadController) {
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (reloadedForUpdate) return;
            reloadedForUpdate = true;
            window.location.reload();
          });
        }

        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js', { updateViaCache: 'none' })
            .then((registration) => registration.update())
            .catch((err) => console.warn('SW registration/update failed:', err));
        });

        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState !== 'visible') return;
          navigator.serviceWorker.ready
            .then((registration) => registration.update())
            .catch((err) => console.warn('SW update check failed:', err));
        });
      }
    </script>
  </head>
  <body class="bg-[#17212b] text-white selection:bg-[#2481cc] selection:text-white antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
