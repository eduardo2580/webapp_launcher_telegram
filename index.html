<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Telegram Web App Launcher PWA</title>
    <meta name="description" content="Ultra-lightweight Telegram Mini App and Web App Launcher with Telegram Cloud Storage synchronization." />
    <meta property="og:title" content="Telegram Web App Launcher PWA" />
    <meta property="og:description" content="Ultra-lightweight Telegram Mini App and Web App Launcher with Telegram Cloud Storage synchronization." />
    <meta property="og:type" content="website" />
    
    <!-- PWA & Mobile Web Meta -->
    <meta name="theme-color" content="#2481cc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Web Launcher" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Telegram WebApp Native SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.warn('SW registration failed:', err);
          });
        });
      }
    </script>
  </head>
  <body class="bg-[#17212b] text-white selection:bg-[#2481cc] selection:text-white antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
